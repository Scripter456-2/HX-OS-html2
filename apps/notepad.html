<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HX Notepad</title>
  <link rel="stylesheet" href="../index.css">
  <style>
    body {
      background: transparent;
      padding: 1rem;
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    .notepad-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .notepad-textarea {
      flex: 1;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--bg-border);
      border-radius: 8px;
      padding: 1rem;
      font-family: var(--font-sans);
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: var(--transition-smooth);
    }
    
    .notepad-textarea:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.05);
    }
    
    .notepad-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }
    
    .save-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(var(--accent-rgb), 0.3);
      transition: var(--transition-smooth);
    }
    
    .save-btn:hover {
      box-shadow: 0 4px 10px rgba(var(--accent-rgb), 0.5);
    }
  </style>
</head>
<body class="theme-dark">
  <div class="notepad-container">
    <textarea class="notepad-textarea" id="note-text" placeholder="Type your text notes here..." oninput="updateCharCount()"></textarea>
    <div class="notepad-footer">
      <span id="char-count">0 characters | 0 words</span>
      <button class="save-btn" onclick="saveNote()">Save Draft</button>
    </div>
  </div>

  <script>
    function syncTheme() {
      if (window.parent && window.parent.document) {
        document.body.className = window.parent.document.body.className;
        const accent = window.parent.document.documentElement.style.getPropertyValue('--accent-color');
        document.documentElement.style.setProperty('--accent-color', accent);
        const accentRgb = window.parent.document.documentElement.style.getPropertyValue('--accent-rgb');
        document.documentElement.style.setProperty('--accent-rgb', accentRgb);
      }
    }
    window.onload = () => {
      syncTheme();
      setInterval(syncTheme, 1000);
      
      // Load draft if any
      const saved = localStorage.getItem('hx_note_draft');
      if (saved) {
        document.getElementById('note-text').value = saved;
        updateCharCount();
      }
    };

    function updateCharCount() {
      const text = document.getElementById('note-text').value;
      const chars = text.length;
      const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
      document.getElementById('char-count').innerText = `${chars} characters | ${words} words`;
    }

    function saveNote() {
      const text = document.getElementById('note-text').value;
      localStorage.setItem('hx_note_draft', text);
      alert("Draft saved to browser local storage!");
    }
  </script>
</body>
</html>
