<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HX Arcade - Snake</title>
  <style>
    body {
      background-color: #111;
      color: #39ff14;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 5px rgba(57, 255, 20, 0.6);
    }
    
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    
    canvas {
      border: 2px solid #39ff14;
      background-color: #000;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }
    
    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 400px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    
    .control-hint {
      font-size: 0.75rem;
      color: #888;
    }
    
    .game-over-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #ff5f56;
      box-shadow: 0 0 20px rgba(255, 95, 86, 0.4);
    }
    
    .game-over-overlay h2 {
      color: #ff5f56;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(255, 95, 86, 0.6);
    }
    
    .restart-btn {
      background: #39ff14;
      color: black;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1.2rem;
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }
    
    .restart-btn:hover {
      background: #2ebd10;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>🐍 HX ARCADE: SNAKE</h1>
    <div class="stats-bar">
      <span>Score: <span id="score-val">0</span></span>
      <span>High: <span id="high-val">0</span></span>
    </div>
    
    <div style="position:relative;">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <!-- Game Over overlay -->
      <div class="game-over-overlay" id="game-over">
        <h2>GAME OVER</h2>
        <p style="color:#fff; margin-bottom:1.5rem;">You crashed into the grid!</p>
        <button class="restart-btn" onclick="resetGame()">Insert Coin & Restart</button>
      </div>
    </div>
    
    <div class="control-hint">Use Keyboard Arrow keys to steer direction.</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const grid = 20;
    let count = 0;
    
    let snake = {
      x: 160,
      y: 160,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };
    
    let apple = {
      x: 320,
      y: 320
    };
    
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    document.getElementById('high-val').innerText = highScore;
    
    let gameOver = false;
    let gameLoopReq;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function loop() {
      if (gameOver) return;
      gameLoopReq = requestAnimationFrame(loop);
      
      // limit game speed to 10 FPS
      if (++count < 6) {
        return;
      }
      count = 0;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Move snake by its velocity
      snake.x += snake.dx;
      snake.y += snake.dy;
      
      // Wrap snake position horizontally on edge
      if (snake.x < 0) {
        snake.x = canvas.width - grid;
      } else if (snake.x >= canvas.width) {
        snake.x = 0;
      }
      
      // Wrap snake position vertically on edge
      if (snake.y < 0) {
        snake.y = canvas.height - grid;
      } else if (snake.y >= canvas.height) {
        snake.y = 0;
      }
      
      // Keep track of where snake has been. Front of the array is always the head
      snake.cells.unshift({x: snake.x, y: snake.y});
      
      // Remove cells as we move away from them
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }
      
      // Draw apple
      ctx.fillStyle = '#ff5f56';
      ctx.fillRect(apple.x, apple.y, grid-1, grid-1);
      
      // Draw snake cells
      ctx.fillStyle = '#39ff14';
      snake.cells.forEach(function(cell, index) {
        
        // Drawing snake body with grid-1 spacing
        ctx.fillRect(cell.x, cell.y, grid-1, grid-1);  
        
        // Snake ate apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          document.getElementById('score-val').innerText = score;
          
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('snake_highscore', highScore);
            document.getElementById('high-val').innerText = highScore;
          }
          
          // Canvas is 400x400 which is 20x20 grids
          apple.x = getRandomInt(0, 20) * grid;
          apple.y = getRandomInt(0, 20) * grid;
        }
        
        // Check collision with all cells after this one (body crash)
        for (let i = index + 1; i < snake.cells.length; i++) {
          
          // Snake head occupies same space as a body cell. Reset game
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            triggerGameOver();
          }
        }
      });
    }

    function triggerGameOver() {
      gameOver = true;
      cancelAnimationFrame(gameLoopReq);
      document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
      document.getElementById('game-over').style.display = 'none';
      score = 0;
      document.getElementById('score-val').innerText = score;
      
      snake.x = 160;
      snake.y = 160;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      
      apple.x = getRandomInt(0, 20) * grid;
      apple.y = getRandomInt(0, 20) * grid;
      
      gameOver = false;
      loop();
    }

    // Keyboard steer inputs
    document.addEventListener('keydown', function(e) {
      if (gameOver) return;
      
      // Prevent screen scroll key default acts
      if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
      
      // Left arrow key
      if (e.which === 37 && snake.dx === 0) {
        snake.dx = -grid;
        snake.dy = 0;
      }
      // Up arrow key
      else if (e.which === 38 && snake.dy === 0) {
        snake.dy = -grid;
        snake.dx = 0;
      }
      // Right arrow key
      else if (e.which === 39 && snake.dx === 0) {
        snake.dx = grid;
        snake.dy = 0;
      }
      // Down arrow key
      else if (e.which === 40 && snake.dy === 0) {
        snake.dy = grid;
        snake.dx = 0;
      }
    });

    // Start game
    loop();
  </script>
</body>
</html>
